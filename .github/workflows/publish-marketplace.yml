name: Publish to VS Code Marketplace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npx vsce package --no-dependencies --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: markda-vsix
          path: '*.vsix'
          retention-days: 14

      - name: Publish verified VSIX (skip already published versions)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "markda-$(node -p "require('./package.json').version").vsix" --skip-duplicate
